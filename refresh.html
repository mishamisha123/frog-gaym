<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071a36">
  <title>Updating Froggy Leap</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#041329,#0b3d78);font-family:system-ui,-apple-system,sans-serif;color:#071a36}
    main{width:min(420px,100%);padding:28px;border-radius:28px;background:linear-gradient(155deg,#10498d,#071f4e);box-shadow:0 24px 70px rgba(5,52,65,.22);text-align:center}
    .frog{font-size:68px;animation:bob .8s ease-in-out infinite alternate}
    h1{margin:8px 0;font-size:28px}
    p{margin:0;color:#a9c7eb;line-height:1.5}
    .bar{height:12px;margin:22px 0 10px;border-radius:999px;background:#061d46;overflow:hidden}
    .bar i{display:block;height:100%;width:10%;border-radius:inherit;background:linear-gradient(90deg,#38d9ff,#6df05b);animation:load 1.25s ease-in-out infinite}
    small{font-weight:900;color:#65e8ff}
    @keyframes load{50%{width:88%}100%{width:100%}}
    @keyframes bob{to{transform:translateY(-8px) rotate(2deg)}}
  </style>
</head>
<body>
  <main>
    <div class="frog">🐸</div>
    <h1>Updating Froggy Leap</h1>
    <p>Removing the old offline cache and loading the consolidated game.</p>
    <div class="bar"><i></i></div>
    <small id="status">Preparing v95…</small>
  </main>
  <script>
    (async () => {
      const status = document.getElementById('status');
      try {
        status.textContent = 'Removing old service workers…';
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration => registration.unregister()));
        }
        status.textContent = 'Clearing old game files…';
        if ('caches' in window) {
          const names = await caches.keys();
          await Promise.all(names.map(name => caches.delete(name)));
        }
        status.textContent = 'Loading v95…';
      } catch (error) {
        console.warn('Refresh helper:', error);
        status.textContent = 'Reloading the game…';
      }
      // localStorage is intentionally untouched, so balance and progress remain.
      setTimeout(() => location.replace('./?build=v95-' + Date.now()), 650);
    })();
  </script>
</body>
</html>
